[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crypteon-cli"
version = "0.1.0"
description = "Agent-based CLI for the Crypteon transform catalog"
authors = [{ name = "Ankush Bhadwar" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
crypteon = "crypteon_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["crypteon_cli"]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
addopts = "-q"

