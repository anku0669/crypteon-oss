name: Build desktop installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (.dmg)
            script: dist:mac
          - os: windows-latest
            name: Windows (.exe)
            script: dist:win
          - os: ubuntu-latest
            name: Linux (AppImage + .deb)
            script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npm run ${{ matrix.script }}
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crypteon-${{ matrix.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.zip
          if-no-files-found: ignore
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.zip
          fail_on_unmatched_files: false
